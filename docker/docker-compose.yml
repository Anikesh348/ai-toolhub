services:
  mongo:
    image: mongo:7
    container_name: tool-builder-mongo
    restart: unless-stopped
    command: ["--quiet"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-toolhub}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-toolhub-dev-password}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-ai-toolhub}
    ports:
      - "${MONGO_BIND_ADDRESS:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    volumes:
      - ${MONGO_DATA_DIR:-../docker-data/mongodb}:/data/db
      - ${MONGO_CONFIG_DIR:-../docker-data/mongodb-config}:/data/configdb
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/27017 && exec 3>&-'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  codex:
    image: ${CODEX_IMAGE_NAME:-tool-builder-codex:latest}
    build:
      context: ..
      dockerfile: docker/Codex.Dockerfile
    container_name: tool-builder-codex
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - ../.env
    environment:
      HOME: ${CODEX_WORKSPACE_CONTAINER}
      XDG_CONFIG_HOME: ${CODEX_WORKSPACE_CONTAINER}/.config
    command: ["/bin/sh", "-lc", "sleep infinity"]
    volumes:
      - ${CODEX_WORKSPACE_HOST}:${CODEX_WORKSPACE_CONTAINER}

  browser_screenshot:
    build:
      context: ..
      dockerfile: docker/BrowserScreenshot.Dockerfile
    container_name: tool-builder-browser-screenshot
    restart: unless-stopped
    cpus: ${BROWSER_SCREENSHOT_CPU_LIMIT:-0.75}
    mem_limit: ${BROWSER_SCREENSHOT_MEMORY_LIMIT:-512m}
    environment:
      TZ: ${BROWSER_SCREENSHOT_TIMEZONE:-Asia/Kolkata}
      SCREENSHOT_PLATFORM_PROFILE: ${BROWSER_SCREENSHOT_PLATFORM_PROFILE:-auto}
      SCREENSHOT_CONCURRENCY: ${BROWSER_SCREENSHOT_CONCURRENCY:-}
      SCREENSHOT_WARM_START: ${BROWSER_SCREENSHOT_WARM_START:-1}
    ports:
      - "${BROWSER_SCREENSHOT_PORT:-4300}:4300"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4300/health', timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tool-builder-backend
    restart: unless-stopped
    depends_on:
      codex:
        condition: service_started
      mongo:
        condition: service_healthy
      browser_screenshot:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_INITDB_ROOT_USERNAME:-toolhub}:${MONGO_INITDB_ROOT_PASSWORD:-toolhub-dev-password}@mongo:27017/${MONGO_DB_NAME:-ai-toolhub}?authSource=admin}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-ai-toolhub}
      BROWSER_SCREENSHOT_INTERNAL_BASE_URL: ${BROWSER_SCREENSHOT_INTERNAL_BASE_URL:-http://browser_screenshot:4300}
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CODEX_WORKSPACE_HOST}:${CODEX_WORKSPACE_HOST}

  ui:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_TOOL_FRONTEND_BASE_URL: ${NEXT_PUBLIC_TOOL_FRONTEND_BASE_URL:-http://localhost}
        NEXT_PUBLIC_TOOL_BACKEND_BASE_URL: ${NEXT_PUBLIC_TOOL_BACKEND_BASE_URL:-http://localhost}
        NEXT_PUBLIC_AUTH_USERNAME: ${NEXT_PUBLIC_AUTH_USERNAME:-admin}
        NEXT_DISABLE_SWC_WORKER: ${UI_NEXT_DISABLE_SWC_WORKER:-1}
    container_name: tool-builder-ui
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${UI_PORT:-3000}:3000"
